server {
    listen 80;
    server_name _;

    # Only the /portal subtree is publicly reachable.
    # Everything else returns 403.

    location /portal {
        proxy_pass         http://web:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static assets referenced by portal pages (court images, etc.)
    location /static/ {
        proxy_pass         http://web:5000;
        proxy_set_header   Host              $host;
        proxy_cache_valid  200 1h;
        expires            1h;
        add_header         Cache-Control "public";
    }

    # Block all other routes
    location / {
        return 403;
    }
}

# To add HTTPS (recommended for production):
#
# 1. Obtain a cert (e.g. certbot --nginx -d yourdomain.com)
# 2. Replace the server block above with:
