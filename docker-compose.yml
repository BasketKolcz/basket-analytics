services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always

  web:
    build: .
    ports:
      - "127.0.0.1:5000:5000"    # admin access via SSH tunnel only; nginx is the public entry point
    environment:
      - DATABASE_URL=postgresql://postgres:basketkolcz2025@db:5432/basketkolcz
      - SECRET_KEY=${SECRET_KEY}
      - PORTAL_LOGIN=${PORTAL_LOGIN}
      - PORTAL_PASS=${PORTAL_PASS}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - PORT=5000
      - MATCH_FILES_DIR=/app/match_files
    command: gunicorn app:app --bind 0.0.0.0:5000 --workers 1 --timeout 120 --reload
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - ./app.py:/app/app.py                          # live reload app.py
      - /tmp/basketkolcz_pending:/tmp/basketkolcz_pending
      - ./match_files:/app/match_files                # pliki Excel meczów
      - ./static:/app/static                          # court images & static assets

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=basketkolcz
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=basketkolcz2025
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  pgdata:
